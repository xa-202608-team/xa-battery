# 电池代码实际只用到下列 5 个第三方库（grep import 核实）：
#   numpy (闭式解/特征), pandas (CSV/DataFrame), torch (LinearHead 预训练+梯度核对),
#   pytest (等价性测试). scipy (twin L2 重建器 calibrate_reconstruction.py).
